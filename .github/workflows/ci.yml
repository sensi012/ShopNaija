name: ShopNaija CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Required for OIDC JWT token authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: shopnaija
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  # ------------------------------------------------------------------
  # Job 1: Test & Lint Python FastAPI Application
  # ------------------------------------------------------------------
  test-app:
    name: Test Application Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Lint Application Code
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Syntax of All App Files
        run: |
          python -m compileall app

      - name: Run Pytest (if tests exist)
        run: |
          pytest || echo "No unit tests found, skipping pytest execution."

  # ------------------------------------------------------------------
  # Job 2: Validate & Plan Terraform Infrastructure
  # ------------------------------------------------------------------
  terraform-ci:
    name: Terraform Init, Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Create Dummy tfvars if Missing
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      # AWS OIDC Authentication (No long-lived access keys required)
      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            terraform init
          else
            terraform init -backend=false
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: terraform plan -no-color

  # ------------------------------------------------------------------
  # Job 3: Deploy Infrastructure & Code to AWS (Main Branch Only)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy Infrastructure & Application
    needs: [test-app, terraform-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Production tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
            sed -i 's/@shopnaija.com/devops@shopnaija.com/g' terraform.tfvars
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Install Deploy Script Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Execute App Deployment Script
        run: python deploy.py
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}