name: ShopNaija CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT_NAME: shopnaija

jobs:
  # ------------------------------------------------------------------
  # Job 1: Test & Lint Python Application
  # ------------------------------------------------------------------
  test-app:
    name: Test Application Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Lint Application Code
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check Syntax of All App Files
        run: |
          python -m compileall app

      - name: Run Pytest (if tests exist)
        run: |
          pytest || echo "No unit tests found, skipping pytest execution."

  # ------------------------------------------------------------------
  # Job 2: Validate & Format Check Terraform Infrastructure
  # ------------------------------------------------------------------
  terraform-ci:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Local Backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ------------------------------------------------------------------
  # Job 3: DevSecOps Vulnerability & Security Scan (Trivy)
  # ------------------------------------------------------------------
  security-scan:
    name: Security & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner (IaC, Secrets & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'